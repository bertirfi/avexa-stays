<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AVEXA STAYS — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Manrope:wght@300;400;500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-page">
  <!-- Background -->
  <div class="login-bg" aria-hidden="true">
    <div class="bg-layer bg-1"></div>
    <div class="bg-layer bg-2"></div>
    <div class="bg-layer bg-3"></div>
    <div class="bg-overlay"></div>
  </div>

  <!-- Back to home -->
  <a href="app-v2.html" class="back-home" aria-label="Back to AVEXA home">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 15L7.5 10L12.5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back
  </a>

  <!-- Auth card -->
  <div class="auth-card">
    <!-- Logo -->
    <div class="auth-logo">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 20 20"><line x1="3" y1="3" x2="17" y2="17" stroke="#fff" stroke-width="2" stroke-linecap="round"/><line x1="17" y1="3" x2="3" y2="17" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <span class="logo-word">AVEXA</span>
    </div>

    <h1 class="auth-title">Your best rate<br>starts here<span class="auth-dot" style="margin: 0px 0px 0px 5px">.</span></h1>

    <ul class="auth-perks">
      <li><span class="perk-check">✓</span> 15% off every booking, automatically</li>
      <li><span class="perk-check">✓</span> Early check-in &amp; late check-out</li>
      <li><span class="perk-check">✓</span> Free cancellation until arrival day</li>
    </ul>

    <!-- Email form -->
    <form class="auth-form" id="emailForm" onsubmit="return false">
      <input type="email" class="auth-input" id="emailInput" placeholder="Enter your email" autocomplete="email" required>
      <button type="submit" class="auth-btn auth-btn-primary" id="emailBtn">Continue</button>
    </form>

    <!-- Divider -->
    <div class="auth-divider">
      <span class="auth-divider-line"></span>
      <span class="auth-divider-text">or</span>
      <span class="auth-divider-line"></span>
    </div>

    <!-- Social auth -->
    <button class="auth-btn auth-btn-social" id="googleBtn">
      <svg class="g-icon" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continue with Google
    </button>

    <button class="auth-btn auth-btn-social" id="appleBtn">
      <svg class="apple-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
      Continue with Apple
    </button>

    <p class="auth-legal">By continuing, you agree to AVEXA's <a href="#">Terms &amp; Conditions</a>, <a href="#">Privacy Policy</a>, and <a href="#">Membership Terms</a>.</p>

    <p class="auth-switch">Already have an account? <a href="#" id="switchLink">Log in</a></p>
  </div>
</div>

<script>
  // Simulate auth — stores user in localStorage, redirects to my-trips
  function doLogin(method) {
    var email = document.getElementById('emailInput').value || 'guest@avexa.com';
    var name = email.split('@')[0];
    // Capitalize first letter
    name = name.charAt(0).toUpperCase() + name.slice(1);
    localStorage.setItem('avexa_user', JSON.stringify({
      name: name,
      email: email,
      method: method,
      loggedIn: true
    }));
    window.location.href = 'my-trips.html';
  }

  document.getElementById('emailForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var email = document.getElementById('emailInput').value;
    if (email) doLogin('email');
  });

  document.getElementById('googleBtn').addEventListener('click', function() {
    doLogin('google');
  });

  document.getElementById('appleBtn').addEventListener('click', function() {
    doLogin('apple');
  });

  document.getElementById('switchLink').addEventListener('click', function(e) {
    e.preventDefault();
    // Just focus the email input
    document.getElementById('emailInput').focus();
  });
</script>
</body>
</html>
