<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AVEXA STAYS — Coming Soon</title>
<meta name="description" content="Bucharest City Center Apartments — Coming soon. First 100 bookings get an additional 10% discount.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Manrope:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#191919;
    --ink-80:rgba(25,25,25,.82);
    --ink-60:rgba(25,25,25,.6);
    --gold:#DDB97A;
    --gold-dark:#B08840;
    --gold-pale:#F7EDDB;
    --cream:#FAF9F5;
    --gray-line:#E6E4DD;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{
    font-family:'Manrope',system-ui,sans-serif;font-weight:300;
    font-size:16px;line-height:1.65;overflow:hidden;
    background:var(--ink);color:#fff;
  }
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--gold);color:var(--ink)}

  /* ── Keyframes (identical to main site) ── */
  @keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
  @keyframes drift{
    0%  {transform:translate(0,0) scale(1)}
    50% {transform:translate(6%,-4%) scale(1.08)}
    100%{transform:translate(-4%,4%) scale(1.04)}
  }
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{to{opacity:1}}

  /* ── Full-screen layout ── */
  .page{
    position:relative;min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;
    justify-content:space-between;
    padding:40px 24px 32px;overflow:hidden;
  }

  /* ── Background (exact match to hero-bg) ── */
  .bg{
    position:absolute;inset:0;overflow:hidden;pointer-events:none;
    background:
      radial-gradient(ellipse 60% 40% at 30% 30%, rgba(221,185,122,.18), transparent 60%),
      radial-gradient(ellipse 50% 40% at 75% 70%, rgba(176,136,64,.22), transparent 60%),
      repeating-linear-gradient(115deg, rgba(255,255,255,.025) 0 2px, transparent 2px 22px),
      linear-gradient(160deg,#1a1a1a 0%, #0f0f0f 100%);
  }
  .bg::before{
    content:"";position:absolute;inset:-20%;
    background:
      radial-gradient(ellipse 30% 40% at 20% 30%, rgba(255,220,160,.12), transparent 60%),
      radial-gradient(ellipse 40% 30% at 70% 60%, rgba(255,180,120,.10), transparent 60%);
    filter:blur(60px);
    animation:drift 18s ease-in-out infinite alternate;
  }
  .bg::after{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 50%, transparent 0%, rgba(25,25,25,.6) 85%),
      linear-gradient(180deg, rgba(25,25,25,.4) 0%, rgba(25,25,25,.1) 40%, rgba(25,25,25,.65) 100%);
  }

  /* ── Logo bar ── */
  .logo-bar{
    position:relative;z-index:2;
    display:flex;align-items:center;gap:14px;
    opacity:0;animation:fadeIn .8s .1s forwards;
  }
  .logo-mark{
    width:72px;height:72px;border-radius:18px;
    background:rgb(71,71,71);border:1px solid rgba(255,255,255,.12);
    display:grid;place-items:center;position:relative;flex:none;
  }
  .logo-mark svg{width:42px;height:42px;display:block}
  .logo-mark svg circle{
    animation:pulse 2.4s ease-in-out infinite;
    transform-box:fill-box;transform-origin:center;
  }
  .wordmark{
    font-family:'Plus Jakarta Sans';font-weight:800;
    font-size:34px;letter-spacing:-0.005em;line-height:1;
    color:var(--gold);
  }

  /* ── Center content ── */
  .content{
    position:relative;z-index:2;
    display:flex;flex-direction:column;align-items:center;
    text-align:center;gap:0;
    max-width:900px;width:100%;
  }

  .eyebrow{
    font-family:'DM Mono';font-size:11px;font-weight:500;
    letter-spacing:.22em;text-transform:uppercase;
    color:var(--gold);margin-bottom:36px;
    display:flex;align-items:center;gap:9px;
    opacity:0;transform:translateY(16px);
    animation:rise .8s .7s cubic-bezier(.16,1,.3,1) forwards;
  }

  .headline{
    font-family:'Plus Jakarta Sans';font-weight:800;
    font-size:clamp(44px,7.5vw,92px);letter-spacing:-0.01em;line-height:.92;
    opacity:0;transform:translateY(40px);
    animation:rise 1s .45s cubic-bezier(.16,1,.3,1) forwards;
  }

  /* Brand X — geometric letterform matching wordmark */
  .brand-x{
    display:inline-block;
    width:0.72em;height:0.75em;
    vertical-align:baseline;
    position:relative;bottom:0;
  }
  .brand-x svg{width:100%;height:100%;display:block}

  /* Brand X — geometric letterform from wordmark */
  .brand-x{
    display:inline-block;
    width:0.74em;height:0.76em;
    vertical-align:baseline;
    color:inherit;
  }
  .brand-x svg{width:100%;height:100%;display:block}

  /* Reusable brand pulse dot */
  .pdot{
    display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--gold);vertical-align:middle;flex-shrink:0;
    animation:pulse 2.4s ease-in-out infinite;
  }

  .subhead{
    font-family:'Plus Jakarta Sans';font-weight:800;
    font-size:clamp(24px,3.8vw,48px);letter-spacing:-0.025em;line-height:1;
    font-style:italic;color:var(--gold);margin-top:10px;
    opacity:0;transform:translateY(30px);
    animation:rise 1s .6s cubic-bezier(.16,1,.3,1) forwards;
  }

  .divider{
    width:48px;height:1px;background:rgba(221,185,122,.5);
    margin:48px auto;
    opacity:0;animation:fadeIn .8s .85s forwards;
  }

  .city{
    font-size:clamp(14px,1.8vw,18px);font-weight:400;
    color:rgba(255,255,255,.75);letter-spacing:.02em;
    opacity:0;transform:translateY(16px);
    animation:rise .8s .9s cubic-bezier(.16,1,.3,1) forwards;
  }

  .offer{
    display:inline-flex;align-items:center;gap:10px;
    background:rgba(221,185,122,.12);border:1px solid rgba(221,185,122,.3);
    border-radius:9999px;padding:11px 22px;margin-top:28px;
    font-family:'DM Mono';font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--gold);
    opacity:0;transform:translateY(16px);
    animation:rise .8s 1.05s cubic-bezier(.16,1,.3,1) forwards;
  }
  .offer .offer-dot{
    width:6px;height:6px;border-radius:50%;background:var(--gold);
    animation:pulse 2.4s ease-in-out infinite;flex-shrink:0;
  }

  /* ── Contact row ── */
  .contact{
    position:relative;z-index:2;
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
    gap:10px 32px;
    opacity:0;animation:fadeIn .8s 1.3s forwards;
  }
  .contact a{
    font-family:'DM Mono';font-size:12px;letter-spacing:.1em;
    color:rgba(255,255,255,.6);transition:color .2s;
    display:flex;align-items:center;gap:7px;
  }
  .contact a:hover{color:var(--gold)}
  .contact a svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.8;fill:none;flex-shrink:0}
  .contact .sep{
    width:3px;height:3px;border-radius:50%;
    background:rgba(255,255,255,.25);flex-shrink:0;
  }

  /* ── Footer bar ── */
  .foot{
    position:relative;z-index:2;width:100%;
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:8px;
    font-family:'DM Mono';font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.3);
    opacity:0;animation:fadeIn .8s 1.5s forwards;
  }
  .foot a{color:rgba(255,255,255,.35);transition:color .2s}
  .foot a:hover{color:var(--gold)}

  /* ── Mobile ── */
  @media (max-width:640px){
    .page{padding:28px 20px 24px}
    .logo-mark{width:52px;height:52px;border-radius:14px}
    .logo-mark svg{width:30px;height:30px}
    .wordmark{font-size:26px}
    .divider{margin:24px auto}
    .offer{font-size:10.5px;padding:10px 16px;letter-spacing:.09em}
    .foot{justify-content:center;text-align:center}
  }

  @media (max-width:390px){
    .headline{font-size:clamp(36px,14vw,60px)}
    .subhead{font-size:clamp(20px,7vw,32px)}
  }

  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  }
</style>
</head>
<body>

<div class="page">

  <!-- Background -->
  <div class="bg" aria-hidden="true"></div>

  <!-- Logo -->
  <div class="logo-bar">
    <span class="logo-mark" aria-hidden="true">
      <svg viewBox="0 0 20 20">
        <line x1="3" y1="3" x2="17" y2="17" style="stroke:rgb(255,255,255)" stroke-width="2" stroke-linecap="round"/>
        <line x1="17" y1="3" x2="3" y2="17" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round"/>
        <circle cx="10" cy="10" r="2" fill="#DDB97A"/>

  <div class="content">

  <!-- Footer -->
  <div class="foot">
    <span>© 2026 AVEXA Stays · Bucharest <span class="pdot" aria-hidden="true" style="margin-left:4px;opacity:.5"></span></span>

</body>
</html>
